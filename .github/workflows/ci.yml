name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions: {}
jobs:
  linux:
    permissions:
      contents: read
    env:
      LC_ALL: C.UTF-8
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:24.04, debian:trixie, archlinux:base-devel]
        compiler: [gcc, clang]
    steps:
      - name: Install build tools
        shell: bash
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential autoconf automake libncurses-dev clang python3 git ca-certificates pkg-config
          else
            pacman -Syu --noconfirm --needed base-devel autoconf automake ncurses clang python git pkgconf
          fi
      - uses: actions/checkout@v4
      - name: Build, fixtures, meter integration and terminal smoke
        env:
          CC: ${{ matrix.compiler }}
        run: tests/ci.sh "$RUNNER_TEMP/check"
  sanitizers:
    permissions:
      contents: read
    env:
      LC_ALL: C.UTF-8
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential autoconf automake libncurses-dev clang libclang-rt-dev llvm python3 git ca-certificates valgrind
      - uses: actions/checkout@v4
      - name: ASan and UBSan
        env:
          CC: clang
          CFLAGS: -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined
          TEST_CFLAGS: -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
          LSAN_OPTIONS: fast_unwind_on_malloc=0
        run: tests/ci.sh "$RUNNER_TEMP/sanitize"
      - name: Valgrind (no application leak suppressions)
        env:
          HOME: ${{ runner.temp }}/valgrind/home
          XDG_CONFIG_HOME: ${{ runner.temp }}/valgrind/home/.config
          HTOPRC: ${{ runner.temp }}/valgrind/home/htoprc
        run: |
          tests/ci.sh "$RUNNER_TEMP/valgrind"
          HTOP_PLUS_SYSROOT="$RUNNER_TEMP/valgrind/tests/fixtures/test_mixed" NVML_TEST_COUNT=2 LD_LIBRARY_PATH="$RUNNER_TEMP/valgrind/tests/stub" valgrind --leak-check=full --errors-for-leak-kinds=all --error-exitcode=1 "$RUNNER_TEMP/valgrind/tests/meters"
  static:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Static musl x86_64 candidate
        run: |
          # Pre-create artifacts as the runner user before the root container writes files.
          mkdir -p "$RUNNER_TEMP/static/artifacts"
          docker run --name htop-plus-static --cpus=4 -v "$GITHUB_WORKSPACE:/source:ro" -v "$RUNNER_TEMP/static:/out" alpine:3.22 sh -c 'apk add --no-cache build-base linux-headers autoconf automake ncurses ncurses-dev ncurses-static curl ca-certificates python3 bash && /source/scripts/build-static.sh /out'
      - name: Run with no runtime packages or terminfo files
        run: |
          printf '%s\n' 'FROM scratch' 'COPY htop-plus-linux-x86_64-musl /htop-plus' 'ENV TERM=xterm-256color' 'ENTRYPOINT ["/htop-plus"]' > "$RUNNER_TEMP/static/Dockerfile"
          docker build -f "$RUNNER_TEMP/static/Dockerfile" -t htop-plus-minimal "$RUNNER_TEMP/static/artifacts"
          # The scratch image has no home directory; config writes use an ephemeral mount.
          docker run --name htop-plus-minimal-test --read-only --tmpfs /config:rw,mode=1777 -e HOME=/config -e XDG_CONFIG_HOME=/config -e HTOPRC=/config/htoprc --cpus=2 -t htop-plus-minimal -d 5 -n 5
          git archive --format=tar.gz --prefix=htop-plus/ -o "$RUNNER_TEMP/static/artifacts/htop-plus-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: htop-plus-linux-x86_64-musl-candidate
          path: ${{ runner.temp }}/static/artifacts/*
          if-no-files-found: error
  automation:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise sync and draft-release safety
        run: python3 -m unittest discover -s tests -p 'test_automation.py' -v
  required:
    name: Build verdict
    if: always()
    needs: [linux, sanitizers, static, automation]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every build and test job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert all(job['result'] == 'success' for job in results.values()), results
          PY
