name: Draft release
on:
  push:
    branches: [main]
    paths: [.htop-plus/upstream-version]
  # Recover bot merges that finish after the sync workflow's bounded wait.
  schedule:
    - cron: '53 7 * * *'
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Optional main commit to build (blank means current main)'
        type: string
        required: false
permissions: {}
concurrency:
  group: draft-release
  cancel-in-progress: false
jobs:
  source:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      build: ${{ steps.source.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Select a main commit
        id: source
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          sha=${REQUESTED_SHA:-$GITHUB_SHA}
          if [[ "$GITHUB_EVENT_NAME" = schedule ]]; then
            sha=$(git log -1 --format=%H -- .htop-plus/upstream-version)
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'Expected a full commit SHA' >&2; exit 1; }
          git merge-base --is-ancestor "$sha" origin/main
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # A catch-up run only builds a marker change that has no complete draft.
          build=true
          if [[ "$GITHUB_EVENT_NAME" = schedule ]]; then
            releases=$(gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100")
            complete=$(jq --arg sha "$sha" '[.[][] | select(.target_commitish == $sha) | select(all(.assets[]; .state == "uploaded" and .size > 0)) | select(([.assets[].name] | sort) == (["COPYING", "COPYING.ncurses", "SHA256SUMS", "htop-plus-linux-x86_64-glibc", "htop-plus-linux-x86_64-musl", "htop-plus-source.tar.gz"] | sort))] | length' <<< "$releases")
            if [[ "$complete" -gt 0 ]]; then build=false; fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
  glibc:
    needs: source
    if: needs.source.outputs.build == 'true'
    runs-on: ubuntu-24.04
    container: debian:trixie
    permissions:
      contents: read
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential autoconf automake libncurses-dev python3 git ca-certificates pkg-config
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Build and test normal binary with runtime NVML support
        run: scripts/build-glibc.sh "$RUNNER_TEMP/glibc"
      - uses: actions/upload-artifact@v4
        with:
          name: release-glibc
          path: ${{ runner.temp }}/glibc/artifacts/*
          if-no-files-found: error
  musl:
    needs: source
    if: needs.source.outputs.build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Build static binary and run device and terminal tests
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/musl/static/artifacts"
          docker run --cpus=4 -v "$GITHUB_WORKSPACE:/source:ro" -v "$RUNNER_TEMP/musl:/out" alpine:3.22 sh -ec '
            apk add --no-cache build-base linux-headers autoconf automake ncurses ncurses-dev ncurses-static curl ca-certificates python3 bash
            export LC_ALL=C.UTF-8
            /source/scripts/build-static.sh /out/static
            /source/tests/ci.sh /out/tests
          '
          printf '%s\n' 'FROM scratch' 'COPY htop-plus-linux-x86_64-musl /htop-plus' 'ENV TERM=xterm-256color' 'ENTRYPOINT ["/htop-plus"]' > "$RUNNER_TEMP/musl/Static.Dockerfile"
          docker build -f "$RUNNER_TEMP/musl/Static.Dockerfile" -t htop-plus-release-smoke "$RUNNER_TEMP/musl/static/artifacts"
          docker run --read-only --tmpfs /config:rw,mode=1777 -e HTOPRC=/config/htoprc --cpus=2 -t htop-plus-release-smoke -d 5 -n 5
      - uses: actions/upload-artifact@v4
        with:
          name: release-musl
          path: ${{ runner.temp }}/musl/static/artifacts/*
          if-no-files-found: error
  draft:
    needs: [source, glibc, musl]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: ${{ runner.temp }}/release
      - name: Combine checksums, licenses and matching source
        env:
          RELEASE_DIR: ${{ runner.temp }}/release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assets"
          cp "$RELEASE_DIR/release-glibc/htop-plus-linux-x86_64-glibc" "$RUNNER_TEMP/assets/"
          cp "$RELEASE_DIR/release-musl/htop-plus-linux-x86_64-musl" "$RUNNER_TEMP/assets/"
          cp "$RELEASE_DIR/release-musl/COPYING" "$RELEASE_DIR/release-musl/COPYING.ncurses" "$RUNNER_TEMP/assets/"
          git archive --format=tar.gz --prefix=htop-plus/ -o "$RUNNER_TEMP/assets/htop-plus-source.tar.gz" HEAD
          cd "$RUNNER_TEMP/assets"
          sha256sum htop-plus-linux-* htop-plus-source.tar.gz COPYING COPYING.ncurses > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Create draft only; owner creates tag and publishes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/draft-release.py "$RUNNER_TEMP/assets"
