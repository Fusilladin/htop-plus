name: Sync upstream
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: sync-upstream
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge newest stable tag and queue squash auto-merge
        id: sync
        run: python3 scripts/sync-upstream.py --github
      - name: Wait for dispatched CI and dispatch release after auto-merge
        if: steps.sync.outputs.pr != ''
        env:
          SYNC_BRANCH: ${{ steps.sync.outputs.branch }}
          SYNC_HEAD: ${{ steps.sync.outputs.head }}
          SYNC_PR: ${{ steps.sync.outputs.pr }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for attempt in {1..30}; do
            run_id=$(gh run list --workflow ci.yml --branch "$SYNC_BRANCH" --event workflow_dispatch --limit 10 --json databaseId,headSha --jq ".[] | select(.headSha == \"$SYNC_HEAD\") | .databaseId" | head -1)
            [ -z "$run_id" ] || break
            sleep 2
          done
          [ -n "$run_id" ] || { echo 'Dispatched CI run not found' >&2; exit 1; }
          gh run watch "$run_id" --exit-status --interval 15
          for attempt in {1..60}; do
            state=$(gh pr view "$SYNC_PR" --json state --jq .state)
            if [ "$state" = MERGED ]; then
              sha=$(gh pr view "$SYNC_PR" --json mergeCommit --jq .mergeCommit.oid)
              gh workflow run release.yml --ref main -f source_sha="$sha"
              exit 0
            fi
            [ "$state" = OPEN ] || { echo "PR state: $state"; exit 0; }
            sleep 5
          done
          echo 'CI passed; PR is still waiting for branch requirements. Owner merge will trigger release.yml.'
